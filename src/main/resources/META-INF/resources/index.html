<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photon Image Processor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2 class="section-title" onclick="toggleSection('transforms')">🔄 Transformations</h2>
            <div class="section-content collapsed" id="transforms-content">
                <div class="effects-grid" id="transformsGrid">
                    <!-- Transformations will be populated by JavaScript -->
                </div>
            </div>

            <h2 class="section-title" onclick="toggleSection('effects')">🎨 Effects</h2>
            <div class="section-content collapsed" id="effects-content">
                <div class="effects-grid" id="effectsGrid">
                    <!-- Effects will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="quarkus-branding">
                <img src="https://quarkus.io/assets/images/brand/quarkus_icon_1024px_default.png" alt="Quarkus" class="quarkus-logo">
                <span class="quarkus-text">Powered by Quarkus</span>
            </div>
            
            <h1>Photon Image Processor</h1>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Drop an image here or click to upload</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="image-container" id="imageContainer" style="display: none;">
                <img id="imagePreview" class="image-preview" alt="Preview">
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Processing image...</div>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
