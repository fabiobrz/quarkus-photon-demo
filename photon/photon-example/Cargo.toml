[package]
name = "photon-example"
version = "0.1.0"
edition = "2018"
rust-version = "1.83"

[lib]
crate-type = ["cdylib"]

[dependencies]
photon-rs = { path = "../photon-rs/crate" }
wasm-bindgen = "=0.2.78"
js-sys = "=0.3.55"
web-sys = { version = "=0.3.55", features = [
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Window",
  "CanvasRenderingContext2d",
  "ImageData",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "console",
  "CssStyleDeclaration",
  "EventTarget",
] }
image = { version = "0.24", default-features = false, features = ["png"] }

[profile.release]
lto = true
opt-level = 3

[profile.dev]
lto = true
opt-level = "s"
